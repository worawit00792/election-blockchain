<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>เข้าสู่ระบบ – เลือกตั้งสภานักศึกษา 2570</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="login">
<div class="auth-page">
  <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(249,168,37,.08) 1px,transparent 1px);background-size:32px 32px"></div>
  <div class="auth-card anim-scale" style="max-width:480px;border-color:rgba(249,168,37,.15)">
    <div style="text-align:center;margin-bottom:20px">
      <img src="/images/ubu-logo.png" alt="UBU" style="height:72px;width:auto;object-fit:contain;margin:0 auto;display:block">
    </div>
    <div style="text-align:center;margin-bottom:28px">
      <h2 style="color:#fff;font-size:22px;font-weight:800;margin-bottom:4px">ยินดีต้อนรับ</h2>
      <p style="color:rgba(255,255,255,.45);font-size:14px">ระบบเลือกตั้งสภานักศึกษา มหาวิทยาลัยอุบลราชธานี 2570</p>
    </div>
    <a id="google-login-btn" href="/auth/google" style="display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;background:#fff;border:1.5px solid rgba(249,168,37,.3);border-radius:var(--r-md);font-size:15px;font-weight:600;color:var(--g800);text-decoration:none;transition:all .2s;margin-bottom:16px"
       onmouseover="this.style.boxShadow='0 4px 20px rgba(249,168,37,.25)'" onmouseout="this.style.boxShadow='none'">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/><path fill="#34A853" d="M6.3 14.7l7 5.1C15 16.1 19.2 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 16.3 2 9.7 7.4 6.3 14.7z"/><path fill="#FBBC05" d="M24 46c5.5 0 10.5-1.9 14.4-5l-6.7-5.5C29.6 37 26.9 38 24 38c-6.1 0-11.3-4.1-13.1-9.7l-7 5.4C7.6 41.5 15.2 46 24 46z"/><path fill="#EA4335" d="M44.5 20H24v8.5h11.8c-.8 2.5-2.4 4.6-4.5 6l6.7 5.5C41.8 36.4 45 30.6 45 24c0-1.3-.2-2.7-.5-4z"/></svg>
      เข้าสู่ระบบด้วย Google
    </a>
    <div style="text-align:center;margin-top:16px">
      <p style="color:rgba(255,255,255,.35);font-size:13px">เฉพาะนักศึกษา ม.อุบลราชธานี (@ubu.ac.th) เท่านั้น</p>
    </div>
    <p style="text-align:center;margin-top:16px"><a href="/home.html" style="color:rgba(255,255,255,.35);font-size:13px">← กลับหน้าหลัก</a></p>
  </div>
</div>
<script>
const params=new URLSearchParams(location.search);
if(params.get('error')==='wrong_domain'){
  document.querySelector('.auth-card').insertAdjacentHTML('afterbegin','<div style="background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:12px;margin-bottom:16px;text-align:center"><p style="color:#fca5a5;font-size:13px">⚠️ ต้องใช้อีเมล @ubu.ac.th เท่านั้น</p></div>');
}
</script>
</body></html>
<script>
// Redirect after Google login if ?next param exists
const nextUrl = new URLSearchParams(location.search).get('next');
if (nextUrl) {
  // Store next URL for after OAuth callback
  sessionStorage.setItem('loginNext', nextUrl);
}
</script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const next = params.get('next');
  if (next) {
    const btn = document.getElementById('google-login-btn');
    if (btn) btn.href = '/auth/google?next=' + encodeURIComponent(next);
  }
})();
</script>
