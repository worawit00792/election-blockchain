<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>รายละเอียดผู้สมัคร – เลือกตั้งสภานักศึกษา</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="candidate_detail">
<div id="site-nav"></div>
<div class="page-body">
  <div id="detail-container" style="padding:48px 0"><div class="container"><div style="text-align:center;padding:40px;color:var(--g400)">กำลังโหลด...</div></div></div>
</div>
<div id="site-footer"></div>
<div id="toast-container" class="toast-wrap"></div>
<script src="/js/main.js"></script>
<script>


async function loadDetail(){
  const id=parseInt(new URLSearchParams(location.search).get('id'))||1;
  try{
    const{candidates}=await api('/api/candidates');
    const c=candidates.find(x=>x.id===id);
    if(!c){location.href='/candidates.html';return;}
    const policies=UBU_UI.policiesOf(c);
    const k=UBU_UI.teamKit(c);
    const col=k.a, deep=k.d, pastel=k.p, light=UBU_UI.mixW(pastel,.55);
    const imgTag=UBU_UI.photoImg(c);
    const bio=(c.biography||'').trim();
    const bioHtml=bio?`<div style="background:#fff;border:1px solid var(--g200);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:36px"><div style="font-size:13px;font-weight:700;color:${deep};margin-bottom:8px">เกี่ยวกับทีม</div><p style="font-size:15px;color:var(--g600);line-height:1.8;white-space:pre-line;margin:0">${UBU_UI.esc(bio)}</p></div>`:'';
    const scoreHtml=(c.voteCount==null)
      ? `<div style="font-size:14px;font-weight:700;color:var(--g500);text-align:right">ประกาศหลังปิดรับคะแนน</div>`
      : `<div style="font-size:22px;font-weight:800;color:${deep}">${c.voteCount} คะแนน</div>`;
    document.getElementById('detail-container').innerHTML=`
    <div class="container">
      <a href="/candidates.html" style="display:inline-flex;align-items:center;gap:8px;color:var(--g500);font-size:14px;margin-bottom:32px;text-decoration:none" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color='var(--g500)'">← กลับไปหน้าผู้สมัครทั้งหมด</a>
      <div class="r-sidebar" style="display:grid;grid-template-columns:380px 1fr;gap:40px;align-items:start">
        <div>
          <div style="position:relative;aspect-ratio:800/1050;background:radial-gradient(circle at 50% 38%,${light} 0%,${pastel} 72%);border-radius:var(--r-xl);overflow:hidden;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.12)">
            ${imgTag}
            <div style="position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(to top,rgba(15,23,42,.22),transparent);pointer-events:none"></div>
          </div>
          <div style="background:#fff;border:1px solid var(--g200);border-radius:var(--r-xl);padding:24px">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
              <div style="width:48px;height:48px;border-radius:12px;background:${col};display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff">${c.id}</div>
              <div><div style="font-size:11px;font-weight:700;color:${deep};text-transform:uppercase">${UBU_UI.esc(c.party)}</div><div style="font-size:20px;font-weight:800;color:var(--navy)">${UBU_UI.esc(c.name)}</div></div>
            </div>
            <p style="font-size:14px;color:var(--g500);line-height:1.6;font-style:italic;border-left:3px solid ${col};padding-left:12px;margin-bottom:20px">"${UBU_UI.esc(c.slogan)}"</p>
            <div style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--g50);border-radius:var(--r-md)">
              <div style="font-size:13px;color:var(--g500)">คะแนนที่ได้รับ</div>
              ${scoreHtml}
            </div>
          </div>
        </div>
        <div>
          <h2 style="font-size:28px;font-weight:800;color:var(--navy);margin-bottom:8px">นโยบายของ${UBU_UI.esc(c.name)}</h2>
          <p style="color:var(--g500);margin-bottom:28px">นโยบายและแผนการพัฒนามหาวิทยาลัยของเรา</p>
          <div style="display:flex;flex-direction:column;gap:14px;margin-bottom:36px">
            ${policies.map((p,i)=>`
            <div style="display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--g200);border-radius:var(--r-lg);padding:18px 20px;transition:all .2s" onmouseover="this.style.borderColor='${col}';this.style.boxShadow='0 4px 16px rgba(0,0,0,.08)'" onmouseout="this.style.borderColor='var(--g200)';this.style.boxShadow='none'">
              <div style="width:36px;height:36px;border-radius:10px;background:${pastel};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:${deep};flex-shrink:0">${i+1}</div>
              <div style="font-size:15px;font-weight:600;color:var(--navy)">${UBU_UI.esc(p)}</div>
            </div>`).join('')}
          </div>
          ${bioHtml}
          <a href="/vote.html" class="btn btn-primary btn-lg" style="padding:16px 40px;font-size:16px">🗳️ ลงคะแนนให้ ${UBU_UI.esc(c.name)}</a>
        </div>
      </div>
    </div>`;
  }catch(e){console.error(e);}
}
loadDetail();
</script>
</body></html>
