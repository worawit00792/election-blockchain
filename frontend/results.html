<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ผลการเลือกตั้ง – สภานักศึกษา</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="results">
<div id="site-nav"></div>
<div class="page-body">
  <div class="page-band">
    <div class="container">
      <div class="badge-live" id="res-badge" style="margin-bottom:12px;display:inline-flex">อัปเดตแบบ Real-time</div>
      <h1>ผลคะแนนเลือกตั้ง</h1>
      <p>ผลคะแนนที่โปร่งใสและตรวจสอบได้</p>
      <div id="res-actions" class="res-actions" style="display:none">
        <button type="button" class="btn btn-primary" onclick="openAnnounce()">▶ โหมดประกาศผล (จอใหญ่)</button>
        <button type="button" class="btn btn-light" onclick="shareResultImage()">แชร์ผลเป็นภาพ</button>
      </div>
    </div>
  </div>
  <div style="padding:48px 0"><div class="container">
    <div class="r-grid-3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:36px">
      <div class="stat-card" style="border-left:4px solid #60a5fa"><div class="stat-label" style="color:#000">ลงคะแนนแล้ว</div><div class="stat-value" style="color:#000" id="total-votes">0</div></div>
      <div class="stat-card" style="border-left:4px solid #60a5fa"><div class="stat-label" style="color:#000">ผู้มีสิทธิ์ทั้งหมด</div><div class="stat-value" style="color:#000">เฉพาะนักศึกษา</div></div>
      <div class="stat-card" style="border-left:4px solid #60a5fa"><div class="stat-label" id="stat3-label" style="color:#000">ปิดรับคะแนนใน</div><div class="stat-value" style="color:#000" id="countdown-topbox">—</div></div>
    </div>
    <div class="stat-card">
      <h3 id="results-title" style="font-size:20px;margin-bottom:4px">คะแนนแต่ละทีม</h3>
      <p id="results-sub" style="color:var(--g500);font-size:14px;margin-bottom:24px"></p>
      <div id="results-container"><div style="text-align:center;padding:40px;color:var(--g400)">กำลังโหลด...</div></div>
    </div>
  </div></div>
</div>
<div id="site-footer"></div>
<div id="toast-container" class="toast-wrap"></div>
<script src="/js/main.js"></script>
</body></html>
