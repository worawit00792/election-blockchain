<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>เลือกตั้งสภานักศึกษา มหาวิทยาลัยอุบลราชธานี 2570</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Noto+Sans+Thai:wght@400;700;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a3e;font-family:'Noto Sans Thai',sans-serif}

.hero-page{
  min-height:100vh;
  background:radial-gradient(ellipse at center top, #1a1a6e 0%, #0a0a3e 60%, #050520 100%);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}

.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}

.hero-content{position:relative;z-index:10;text-align:center;padding:24px;max-width:700px;width:100%}

.hero-logo{height:80px;width:auto;object-fit:contain;margin:0 auto 32px;display:block;filter:drop-shadow(0 4px 16px rgba(255,255,255,.2))}

.hero-title{
  font-size:clamp(36px,7vw,72px);
  font-weight:900;
  line-height:1.15;
  background:linear-gradient(135deg,#ff8c00,#ffcc00);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:8px;
}
.hero-subtitle{
  font-family:'Caveat',cursive;
  font-size:clamp(22px,4vw,40px);
  color:#ff69b4;
  margin-bottom:16px;
  display:block;
}
.hero-desc{
  font-size:clamp(14px,2vw,18px);
  color:rgba(255,255,255,.7);
  margin-bottom:56px;
  line-height:1.7;
}

.btn-hero{
  display:inline-flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,#ff4500,#ff8c00);
  color:#fff;font-size:clamp(18px,2.5vw,24px);font-weight:900;
  font-family:'Noto Sans Thai',sans-serif;
  padding:20px 56px;border-radius:50px;border:none;cursor:pointer;
  text-decoration:none;
  box-shadow:0 8px 0 #b83200, 0 16px 40px rgba(255,69,0,.4);
  transition:all .15s ease;
  position:relative;top:0;
}
.btn-hero:hover{top:4px;box-shadow:0 4px 0 #b83200,0 8px 20px rgba(255,69,0,.4)}
.btn-hero:active{top:8px;box-shadow:0 0px 0 #b83200,0 2px 8px rgba(255,69,0,.3)}

.hero-date{
  margin-top:32px;
  color:rgba(255,255,255,.35);
  font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
</style>
</head>
<body>
<div class="hero-page">
  <div class="stars" id="stars"></div>

  <div class="hero-content">
    <img src="/images/ubu-logo.png" alt="UBU" class="hero-logo">
    <div class="hero-title">เลือกตั้งสภานักศึกษา</div>
    <span class="hero-subtitle">มหาวิทยาลัยอุบลราชธานี 2570</span>
    <div class="hero-desc">ร่วมกันสร้างมหาวิทยาลัยที่ดีกว่า ด้วยเสียงของคุณ</div>
    <a href="/home.html" class="btn-hero">🗳️ ลงคะแนนเลยตอนนี้</a>
    <div class="hero-date">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      เปิดรับลงคะแนน 1 – 7 มิถุนายน 2570
    </div>
  </div>
</div>

<script>
const s=document.getElementById('stars');
for(let i=0;i<120;i++){
  const el=document.createElement('div');
  el.className='star';
  const size=Math.random()*2.5+0.5;
  el.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-delay:${Math.random()*4}s;animation-duration:${2+Math.random()*3}s`;
  s.appendChild(el);
}
</script>
</body></html>
